name: Build and Test

on:
  push:
    branches:
      - dev
      - main
      - master
      - 3.0
  pull_request:
    branches:
      - dev
      - main
      - master
      - 3.0
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: canghai908/zbxtable-web
          path: zbxtable-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zbxtable-web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Build frontend
        working-directory: ./zbxtable-web
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          echo "📦 Building frontend..."
          npm ci
          npm run build
          test -f web/index.html
          echo "✓ Frontend build complete"

      - name: Sync frontend assets into embedded web directory
        run: |
          echo "📋 Syncing frontend assets..."
          rm -rf api/v1/web/web
          mkdir -p api/v1/web/web
          cp -R zbxtable-web/web/. api/v1/web/web/
          test -f api/v1/web/web/index.html
          echo "✓ Frontend assets synced"

      - name: Install Go dependencies
        run: make install

      - name: Check Go formatting
        run: |
          fmt_files="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$fmt_files" ]; then
            echo "The following files need gofmt:"
            echo "$fmt_files"
            exit 1
          fi

      - name: Run go vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-zbxtable
        continue-on-error: true

      - name: Build application
        run: make build

      - name: Verify build output
        run: |
          test -f build/zbxtable
          ls -lh build/zbxtable

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbxtable-linux-amd64-build
          path: build/zbxtable
          if-no-files-found: error
