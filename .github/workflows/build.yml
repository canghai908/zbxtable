name: Build and Test

on:
  push:
    branches:
      - main
      - master
      - 3.0
    paths:
      - 'zbxtable/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
      - master
      - 3.0
    paths:
      - 'zbxtable/**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出后端代码
        uses: actions/checkout@v4

      - name: 检出前端代码
        uses: actions/checkout@v4
        with:
          repository: canghai908/zbxtable-web
          path: zbxtable-web

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: zbxtable-web/package-lock.json

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum

      - name: 构建前端
        working-directory: ./zbxtable-web
        run: |
          echo "📦 构建前端..."
          npm ci
          npm run build
          echo "✓ 前端构建完成"

      - name: 复制前端构建产物到后端
        run: |
          echo "📋 复制前端文件..."
          mkdir -p api/v1/web/web
          cp -r zbxtable-web/web/* api/v1/web/web/
          echo "✓ 前端文件复制完成"

      - name: 安装依赖
        run: make install

      - name: 代码格式检查
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "以下文件需要格式化:"
            gofmt -l .
            exit 1
          fi

      - name: 代码静态检查
        run: make vet

      - name: 运行测试
        run: make test

      - name: 生成测试覆盖率
        run: make coverage

      - name: 上传测试覆盖率
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-zbxtable
        continue-on-error: true

      - name: 编译应用
        run: make build

      - name: 验证编译产物
        run: |
          if [ -f build/zbxtable ]; then
            echo "✅ 编译成功"
            ls -lh build/zbxtable
          else
            echo "❌ 编译失败"
            exit 1
          fi

      - name: 构建成功
        run: echo "✅ 构建和测试全部通过！"

